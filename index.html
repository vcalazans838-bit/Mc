const gate=document.getElementById('authGate');

let creating=false;
function say(t){msg.textContent=t;}
function mode(create){creating=create;login.hidden=create;signup.hidden=!create;title.textContent=create?'Criar sua conta':'Entrar na sua conta';toggle.textContent=create?'Já tenho conta · Entrar':'Ainda não tenho conta · Cadastrar';say('');}

signup.addEventListener('submit',async e=>{e.preventDefault();say('Criando conta...');const {data,error}=await sb.auth.signUp({email:document.getElementById('newEmail').value.trim(),password:document.getElementById('newPassword').value});if(error){say(error.message);return;}say(data.session?'Conta criada! Acessando...':'Conta criada! Confira seu e-mail para confirmar e depois entre.');});
logout.addEventListener('click',async()=>{const {error}=await sb.auth.signOut();if(error)say(error.message);});
sb.auth.onAuthStateChange((_event,session)=>{const ok=!!session;gate.style.display=ok?'none':'grid';logout.style.display=ok?'block':'none';if(ok){say('');mode(false);}});
const {data:{session}}=await sb.auth.getSession();
if(session){gate.style.display='none';logout.style.display='block';}else{gate.style.display='grid';}
</script>

  mine=evalR(t,B.otx,B.om.n);opponent=evalR(B.otx,t,G.mc.name);
  toast("Não foi possível avaliar com IA. Os dois versos foram avaliados pelo mesmo sistema reserva. "+err.message);
 }
 if(B!==current)return;
 const sub=mine.scores||mine.sub||evalR(t,B.otx,B.om.n).sub;
 const m=scoreTotal(mine),o=scoreTotal(opponent);
 B.subs.push(sub);
 fin(m,o,{sub,notes:mine.notes||"Avaliação da rima, sem bônus por atributos."});
}
async function resMate(){
 const current=B;B.st="evaluating";render();let mine,opponent;
 try {
  [mine,opponent]=await Promise.all([
   askRapAI({mode:"evaluate",verse:B.mtx,opponentLine:B.otx,opponentName:B.om.n,mcName:B.sp.n,mcStyle:B.sp.s||"livre"}),
   askRapAI({mode:"evaluate",verse:B.otx,opponentLine:B.mtx,opponentName:B.sp.n,mcName:B.om.n,mcStyle:B.om.s||"livre"})
  ]);
 } catch(err) { mine=evalR(B.mtx,B.otx,B.om.n);opponent=evalR(B.otx,B.mtx,B.sp.n); }
 if(B!==current)return;
 fin(scoreTotal(mine),scoreTotal(opponent),{who:"O round foi decidido somente pela qualidade das rimas."});
}
function fin(m,o,x){B.sm+=m;B.so+=o;const w=m>=o;w?B.pm++:B.po++;B.last={m,o,win:w,...x};B.st="res";render()}
function nextR(){B.rd++;B.rd<B.e.ro?setupRound():endDuel()}
function endDuel(){const w=B.pm>B.po||(B.pm==B.po&&B.sm>=B.so),e=B.e;B.dw=w;G.n++;w?G.w++:G.l++;G.T++;
 const on=B.tr?"Trio de "+B.ot[0].n:B.o.n,d=day(G.T);G.hist.push({e:e.n,d,o:on,r:w?"V":"D",s:B.pm+"x"+B.po});chk();save();B.st="dend";render()}
function afterDuel(){const e=B.e;if(B.dw&&B.duel<e.du-1){B.duel++;newDuel();return render()}
 const won=B.dw,k=B.duel;let pr=won?e.pr:Math.round(e.pr*.12*k),rp=won?e.rp:Math.round(e.rp*.3*(k/Math.max(1,e.du-1))),tro="";
 G.money+=pr;G.earned+=pr;G.rep=Math.min(100,G.rep+rp);
 if(won){if(e.g)G.flags[e.g]=1;if(e.ti){G.tr.push({e:e.id,d:day(G.T)});tro=`<div class="tro"><div class="ic">${tic(e)}</div><b>Nova conquista na galeria!</b>${e.g?`<div class="ok">${FL[e.g]}</div>`:""}</div>`}}
 let fo="";if(won&&B.br){G.fol.push({mc:G.mc.name,ev:e.n,d:day(G.T),cty:cityName(e.c),opp:"Chave de "+B.br.r[0].length+" MCs",r:"Campeão",br:{r:B.br.r.map(l=>l.map(x=>x.n))}});fo=`<div class="tro"><b>Você ganhou a folhinha!</b></div><div style="overflow-x:auto"><div style="min-width:640px">${folhaSVG(G.fol[G.fol.length-1])}</div></div>`}
 chk();B.sum=`<div class="card"><div class="res ${won?"w":"l"}">${won?"CAMPEÃO":"ELIMINADO"}</div><p style="text-align:center">${e.n}</p>${tro}${fo}${B.br&&!won?'<p class="mut" style="text-align:center">Quem perde não leva a folhinha. Volte e tente de novo.</p>':""}<p>Prêmio: <b>${R(pr)}</b> · Reputação +${rp}</p><p><button class="btn" onclick="go('inicio')">Voltar ao menu</button></p></div>`;B.st="end";save();render()}

function phase(){const n=B.br.r[B.duel].length;return n>8?"Oitavas de final":n>4?"Quartas de final":n>2?"Semifinal":"Final"}
function mkBr(e){const n=e.br,pool=OPP.concat(EXTRA).sort((a,b)=>a.avg-b.avg).slice(0,Math.round(n*1.1));return{r:[shuf(shuf(pool).slice(0,n-1).concat([{me:1,n:G.mc.name,avg:0}]))]}}
function brStep(){const b=B.br,cur=b.r[B.duel],nx=[];for(let i=0;i<cur.length;i+=2){const a=cur[i],c=cur[i+1];if(a.me||c.me){nx.push({me:1,n:G.mc.name,avg:0});B.o=a.me?c:a}else nx.push(a.avg+Math.random()*40>=c.avg+Math.random()*40?a:c)}b.r[B.duel+1]=nx}
function brPrev(){if(!B.br)return"";const e=B.e;return `<div class="card"><b>Chave · ${phase()}</b><div style="overflow-x:auto"><div style="min-width:640px">${folhaSVG({ev:e.n,d:day(G.T),mc:G.mc.name,cty:cityName(e.c),br:{r:B.br.r.map(l=>l.map(x=>x.n))}},B.duel)}</div></div></div>`}
function openFolha(i){modal(`<div style="overflow-x:auto"><div style="min-width:720px">${folhaSVG(G.fol[i])}</div></div><p><button class="btn sec" onclick="modal()">Fechar</button></p>`)}
function folhaSVG(f,upto){const r=f.br.r,N=r[0].length,R=Math.log2(N),up=upto==null?R:upto,W=N>8?800:640,P=10,CC=150,cw=(W-2*P-CC)/(2*R),rh=N>8?30:38,top=100,half=N/2,H=top+half*rh+30,fs=N>8?12:14,me=f.mc,yy=[];
 for(let j=0;j<R;j++){yy[j]=[];for(let i=0;i<(half>>j);i++)yy[j][i]=j?(yy[j-1][2*i]+yy[j-1][2*i+1])/2:top+(i+.5)*rh}
 const yc=yy[R-1][0],cx=W/2;let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;background:#f6f0dc" role="img" aria-label="Chave da ${esc(f.ev)}"><g stroke="#a9c4e0" stroke-width=".8">`;
 for(let y=24;y<H;y+=26)s+=`<path d="M0 ${y}H${W}"/>`;
 s+=`</g><g font-family="'Permanent Marker',cursive" fill="#262320"><text x="${cx}" y="46" text-anchor="middle" font-size="32" transform="rotate(-1.5 ${cx} 46)">${esc(f.ev.toUpperCase())}</text></g><path d="M${cx-130} 56q32 -8 65 0t65 0t65 0t65 0" fill="none" stroke="#d3125c" stroke-width="2.5" stroke-linecap="round"/><text x="${cx}" y="76" text-anchor="middle" font-family="Barlow,sans-serif" font-size="13" fill="#5c5a68">${esc(f.cty||"")} · ${esc(f.d)}</text><g fill="none" stroke="#262320" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">`;
 let tx="";
 for(const sd of [0,1])for(let j=0;j<R;j++){const cnt=half>>j,x0=sd?W-P-j*cw:P+j*cw,x1=sd?x0-cw:x0+cw,xa=Math.min(x0,x1);
  for(let i=0;i<cnt;i++){const y=yy[j][i];s+=`<path d="M${x0} ${y}H${x1}"/>`;if(j<R-1&&i%2==0)s+=`<path d="M${x1} ${y}V${yy[j][i+1]}"/>`;
   const nm=j<=up?r[j][(sd?cnt:0)+i]:"";if(nm){const L=nm.length*fs*.6>cw-8?` textLength="${cw-8}" lengthAdjust="spacingAndGlyphs"`:"";tx+=`<text x="${xa+4}" y="${y-5}" font-size="${fs}"${L} fill="${nm==me?"#d3125c":"#262320"}">${esc(nm)}</text>`}}}
 s+=`<path d="M${P+R*cw} ${yc}H${W-P-R*cw}"/></g><g font-family="'Permanent Marker',cursive">${tx}`;
 const ch=up>=R?r[R][0]:"";if(ch){const L=ch.length*17*.6>CC-10?` textLength="${CC-10}" lengthAdjust="spacingAndGlyphs"`:"";s+=`<text x="${cx}" y="${yc-8}" text-anchor="middle" font-size="17"${L} fill="${ch==me?"#d3125c":"#262320"}">${esc(ch)}</text><g transform="translate(${cx} ${yc-48}) scale(1.5)"><path d="M-14 9L-17 -8L-8 0L0 -12L8 0L17 -8L14 9Z" fill="#ffcf1f" stroke="#262320" stroke-width="1.4" stroke-linejoin="round"/><circle cx="-17" cy="-9" r="2" fill="#ffcf1f" stroke="#262320"/><circle cx="0" cy="-13" r="2" fill="#ffcf1f" stroke="#262320"/><circle cx="17" cy="-9" r="2" fill="#ffcf1f" stroke="#262320"/></g>`}
 return s+"</g></svg>"}
function vArm(){G.pl=G.pl||{};
 const tI=(i,pl)=>{const x=G.tr[i],e=EV(x.e),p=G.pl["t"+i];return `<div class="it t${pl?" pl":""}" data-k="t${i}" title="${e.n}" ${pl?`style="left:${p.x}%;top:${p.y}%"`:""}><div class="ic">${tic(e)}</div></div>`},
 fI=(i,pl)=>{const f=G.fol[i],p=G.pl["f"+i];return `<div class="it f fb${pl?" pl":""}" data-k="f${i}" ${pl?`style="left:${p.x}%;top:${p.y}%"`:""}>${folhaSVG(f)}</div>`},
 tl=G.tr.map((_,i)=>i),fl=G.fol.map((_,i)=>i),ph=[...tl.filter(i=>G.pl["t"+i]).map(i=>tI(i,1)),...fl.filter(i=>G.pl["f"+i]).map(i=>fI(i,1))].join(""),
 ti=tl.filter(i=>!G.pl["t"+i]).map(i=>tI(i)).join(""),fi=fl.filter(i=>!G.pl["f"+i]).map(i=>fI(i)).join("");
 return `<h2>Meu armário</h2><p class="mut">Arraste troféus para a estante (ou qualquer canto) e folhinhas para o quadro. Para guardar de volta, solte no inventário. Toque num item para ver os detalhes.</p><div id="cena"><div id="estante"><i style="top:30%"></i><i style="top:62%"></i><i style="top:94%"></i></div><div id="quadro"><span>QUADRO</span></div>${ph}</div><div id="inv" class="card"><h3>Inventário</h3><div class="mut">Troféus</div><div class="invg">${ti||'<span class="mut">Nenhum troféu fora do armário. Vença finais para ganhar mais.</span>'}</div><div class="mut">Folhinhas</div><div class="invg">${fi||'<span class="mut">Nenhuma folhinha no inventário. Cada duelo gera uma nova.</span>'}</div></div>`}
function drag(ev){const el=ev.target.closest(".it"),k=el.dataset.k,r=el.getBoundingClientRect(),g=el.cloneNode(true);ev.preventDefault();g.classList.remove("pl");
 g.style.cssText=`position:fixed;z-index:50;pointer-events:none;margin:0;width:${r.width}px;height:${r.height}px;opacity:.9;transform:translate(-50%,-50%)`;
 const sx=ev.clientX,sy=ev.clientY;let mv=0;const pos=e=>{g.style.left=e.clientX+"px";g.style.top=e.clientY+"px"},
 move=e=>{if(!mv&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){mv=1;document.body.appendChild(g)}if(mv)pos(e)},
 up=e=>{removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);g.remove();drop(k,e,mv)};
 addEventListener("pointermove",move);addEventListener("pointerup",up);addEventListener("pointercancel",up)}
function drop(k,e,mv){const x=e.clientX,y=e.clientY,T=k[0]=="t",o=(T?G.tr:G.fol)[+k.slice(1)];
 if(!mv)return toast(T?EV(o.e).n+" · "+o.d:o.ev+" · "+o.r+" · "+o.d);
 const inn=s=>{const r=$(s).getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom},c=$("#cena").getBoundingClientRect();
 if(inn("#inv"))delete G.pl[k];
 else if(inn("#cena")){if(!T&&!inn("#quadro"))return toast("Folhinhas ficam no quadro.");G.pl[k]={x:clamp((x-c.left)/c.width*100,6,94),y:clamp((y-c.top)/c.height*100,6,94)}}
 else return;save();render()}
document.addEventListener("pointerdown",ev=>{if(G.tab=="arm"&&!B&&G.mc&&ev.target.closest&&ev.target.closest(".it"))drag(ev)});
render();
